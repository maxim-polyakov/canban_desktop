services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5177:5000"
    env_file: ./server/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Smtp__Host: smtp-service-canban
      Smtp__Port: 1025
      Redis__Configuration: redis:6379
    depends_on:
      - smtp-service-canban
      - redis
    networks:
      - canban_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3177:3000"
    env_file: ./client/.env
    depends_on:
      - api
    networks:
      - canban_net
  
    # Добавляем новый сервис для отправки почты
  smtp-service-canban:
    image: maildev/maildev
    container_name: smtp-service-canban
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--no-warnings=DeprecationWarning
      - DEBUG=maildev*
    env_file:
      - ./server/.env
    entrypoint:
      - /bin/sh
    command:
      - -c
      - 'exec node dist/bin/maildev.js --outgoing-host "$${SMTP_OUTGOING_HOST}" --outgoing-port "$${SMTP_OUTGOING_PORT}" --outgoing-secure --outgoing-user "$${SMTP_OUTGOING_USER}" --outgoing-pass "$${SMTP_OUTGOING_PASSWORD}" --auto-relay --verbose'
    ports:
      - "8183:1080"
    networks:
      - canban_net

  redis:
    image: redis:7-alpine
    container_name: redis-canban
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - canban_net

networks:
  canban_net:
    driver: bridge
